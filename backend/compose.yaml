services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://legal:${POSTGRES_PASSWORD:-local-demo-only}@postgres:5432/legal
      INDEX_PATH: /app/data/index/corpus.json
      LLM_PROVIDER: ${LLM_PROVIDER:-disabled}
      LLM_MODEL: ${LLM_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ORGANIZER_API_KEY: ${ORGANIZER_API_KEY:-}
      ORGANIZER_BASE_URL: ${ORGANIZER_BASE_URL:-}
      APP_ENV: ${APP_ENV:-public}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      CORPUS_ROOT: /app/data/raw
    volumes:
      - ./data/raw:/app/data/raw:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: legal
      POSTGRES_USER: legal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal -d legal"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:

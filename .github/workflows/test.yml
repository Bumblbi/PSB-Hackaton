name: Backend checks
on: [push, pull_request]
defaults:
  run:
    working-directory: backend
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements.lock
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m scripts.build_index data/demo/manifest.json data/index/corpus.json
      - run: python -m scripts.package_submission --index data/index/corpus.json
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: legal
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: legal
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U legal -d legal"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://legal:ci-only@localhost:5432/legal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m scripts.smoke

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    env_file: ./backend/.env
    environment:
      DATABASE_URL: sqlite:////app/data/db/legal.db
      INDEX_PATH: /app/data/index/corpus.json
      CORPUS_ROOT: /app/data/raw
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - sqlite_data:/app/data/db
      - ./backend/data/raw:/app/data/raw:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  sqlite_data:
